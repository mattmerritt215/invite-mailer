name = "invite-mailer"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Uncomment to serve the worker from a stable hostname on a Cloudflare DNS zone.
# routes = [{ pattern = "invite-mailer.fagmob.lol", custom_domain = true }]

[vars]
# authentik instance used for API calls. Invite links use each brand's own
# authUrl from src/brands.js instead.
AUTHENTIK_URL = "https://auth.fagmob.lol"
# Brand (key in src/brands.js) for invitations that aren't bound to a flow.
DEFAULT_BRAND = "fagmob"

# Secrets, set with `npx wrangler secret put <NAME>`:
#   WEBHOOK_SECRET   = same value as FAGMOB_MAILER_SECRET in authentik's .env
#   AUTHENTIK_TOKEN  = API token of a service account with "Can view Invitation"
#   RESEND_API_KEY   = Resend API key with sending access, shared by all brands
#   RESEND_API_KEY_<BRAND> (optional, e.g. RESEND_API_KEY_FAGMOB) = a key for
#                      one brand's domain; overrides RESEND_API_KEY for that brand

[observability]
enabled = true